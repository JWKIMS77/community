<title>커뮤니티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: sticky header + centered 1080px container; list column with aside on desktop, one column on phone */
:root{
  --bg:#f7f8fa;
  --surface:#ffffff;
  --fg:#1b1e24;
  --muted:#6b7684;
  --faint:#8b95a1;
  --border:#e5e8ec;
  --accent:#2e62e8;
  --accent-strong:#2250c8;
  --accent-soft:#eef3fe;
  --on-accent:#ffffff;
  --danger:#e5484d;
  --star:#f6a609;
  --cat-free:#2e62e8;
  --cat-qna:#7c5cd6;
  --cat-info:#1a9e6e;
  --cat-review:#d97917;
  --cat-job:#0f8c8c;
  --cat-notice:#e5484d;
  --shadow:0 1px 3px rgba(27,30,36,.06);
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --surface:#1a1d24; --fg:#e8eaee; --muted:#9aa3b0; --faint:#7d8694;
    --border:#2a2e37; --accent:#6c93ff; --accent-strong:#86a6ff; --accent-soft:#1f2a45;
    --on-accent:#10131a; --danger:#ff6369; --star:#f0b13a;
    --cat-free:#6c93ff; --cat-qna:#a98df0; --cat-info:#3fc08f; --cat-review:#efa14a; --cat-job:#38b8b8; --cat-notice:#ff6369;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1a1d24; --fg:#e8eaee; --muted:#9aa3b0; --faint:#7d8694;
  --border:#2a2e37; --accent:#6c93ff; --accent-strong:#86a6ff; --accent-soft:#1f2a45;
  --on-accent:#10131a; --danger:#ff6369; --star:#f0b13a;
  --cat-free:#6c93ff; --cat-qna:#a98df0; --cat-info:#3fc08f; --cat-review:#efa14a; --cat-job:#38b8b8; --cat-notice:#ff6369;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button{font-family:var(--font);font-size:14px;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--font);font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
a{color:var(--accent)}
[hidden]{display:none!important}

/* ---------- header ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--border)}
.header-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;height:58px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:900;letter-spacing:-.5px;background:none;padding:0;flex:none}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;font-weight:900}
.top-nav{display:flex;gap:4px;min-width:0}
.nav-tab{font-size:15px;font-weight:500;color:var(--muted);padding:8px 10px;border-radius:8px;white-space:nowrap}
.nav-tab:hover{color:var(--fg)}
.nav-tab[aria-pressed="true"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.header-spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:10px;padding:9px 16px;transition:background .15s}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{background:var(--accent-strong)}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--fg)}
.btn:focus-visible,.chip:focus-visible,.post-row:focus-visible,.nav-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){
  .brand-text{display:none}
  .header-inner{gap:8px;height:52px}
}

/* ---------- shell ---------- */
.shell{max-width:1080px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 60px}
.columns{display:flex;gap:28px;align-items:flex-start}
.main-col{flex:1;min-width:0}
.aside-col{width:300px;flex:none;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){.aside-col{display:none}}

/* ---------- banner ---------- */
.banner{background:var(--accent-soft);color:var(--fg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:16px}

/* ---------- category chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}

/* ---------- list ---------- */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.list-toolbar{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.list-toolbar input{flex:1;min-width:0;border-radius:999px;padding:8px 16px;background:var(--bg);border-color:transparent}
.post-row{display:block;width:100%;text-align:left;padding:16px 18px;border-bottom:1px solid var(--border);background:none;transition:background .1s}
.post-row:last-child{border-bottom:none}
.post-row:hover{background:var(--bg)}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cat-badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;flex:none}
.post-title{font-size:16px;font-weight:700;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment-count{color:var(--accent);font-weight:700;font-size:14px;flex:none}
.row-excerpt{color:var(--muted);font-size:14px;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--faint);flex-wrap:wrap}
.row-meta .author{color:var(--muted);font-weight:500}
.dot::before{content:"·"}

/* ---------- empty / loading ---------- */
.empty{padding:64px 24px;text-align:center}
.empty-icon{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px;font-size:26px}
.empty h3{margin:0 0 6px;font-size:17px;text-wrap:balance}
.empty p{margin:0 0 18px;color:var(--muted);font-size:14px}

/* ---------- aside ---------- */
.aside-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.aside-card h3{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:-.2px}
.hot-item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:7px 0;background:none}
.hot-rank{font-weight:900;color:var(--accent);font-size:14px;flex:none;width:16px;font-variant-numeric:tabular-nums}
.hot-title{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-item:hover .hot-title{text-decoration:underline}
.hot-meta{flex:none;font-size:12px;color:var(--faint)}
.about-text{font-size:13.5px;color:var(--muted);margin:0}

/* ---------- detail ---------- */
.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px}
.back-btn{color:var(--muted);font-weight:500;padding:4px 0;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
.back-btn:hover{color:var(--fg)}
.detail-title{font-size:22px;font-weight:900;letter-spacing:-.4px;margin:10px 0 8px;text-wrap:balance;overflow-wrap:anywhere}
.detail-meta{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--faint);padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.detail-body{padding:20px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.detail-actions{display:flex;gap:8px;align-items:center;padding:4px 0 20px;border-bottom:1px solid var(--border)}
.like-btn{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;color:var(--muted)}
.like-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.del-btn{color:var(--faint);font-size:13px;margin-left:auto}
.del-btn:hover{color:var(--danger)}
.del-confirm{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.del-yes{color:var(--danger);font-weight:700}

/* ---------- comments ---------- */
.comments{padding-top:18px}
.comments h3{font-size:15px;margin:0 0 14px}
.comment{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--border)}
.comment:last-of-type{border-bottom:none}
.comment-head{display:flex;gap:8px;align-items:baseline}
.comment-author{font-weight:700;font-size:14px}
.comment-time{font-size:12.5px;color:var(--faint)}
.comment-del{font-size:12.5px;color:var(--faint);margin-left:auto}
.comment-del:hover{color:var(--danger)}
.comment-body{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-form{display:flex;gap:8px;margin-top:14px}
.comment-form input{flex:1;min-width:0}

/* ---------- lock (조건부 열람) ---------- */
.lock-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13.5px;margin:4px 0 14px}
.lock-note strong{font-weight:700}
.locked-text{filter:blur(5px);user-select:none;pointer-events:none;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.locked-text{transition:filter .2s}}

/* ---------- reviews ---------- */
.review-summary{display:flex;gap:16px;align-items:baseline;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.review-summary .big{font-size:22px;font-weight:900;letter-spacing:-.4px}
.review-summary .sub{font-size:13.5px;color:var(--muted)}
.stars{color:var(--star);letter-spacing:1px;font-size:inherit}
.stars .off{color:var(--border)}
.company-row{width:100%;text-align:left;padding:16px 18px;border-bottom:1px solid var(--border);background:none;transition:background .1s}
.company-row:hover{background:var(--bg)}
.company-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.company-name{font-size:16px;font-weight:700;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.company-score{font-weight:900;font-variant-numeric:tabular-nums}
.company-count{font-size:13px;color:var(--faint)}
.company-open{margin-left:auto;color:var(--faint);font-size:13px;flex:none}
.company-reviews{border-bottom:1px solid var(--border);background:var(--bg);padding:6px 18px}
.review-item{padding:14px 0;border-bottom:1px solid var(--border)}
.review-item:last-child{border-bottom:none}
.review-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.status-badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:color-mix(in srgb, var(--muted) 12%, transparent);color:var(--muted)}
.review-oneliner{font-weight:700;font-size:15px;margin:2px 0 6px;overflow-wrap:anywhere}
.pros-cons{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pc-row{display:flex;gap:8px}
.pc-tag{flex:none;font-weight:700;font-size:13px}
.pc-tag.good{color:var(--cat-info)}
.pc-tag.bad{color:var(--danger)}
.pc-body{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.review-meta{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--faint);margin-top:8px;flex-wrap:wrap}

/* ---------- write modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-left,0px));background:rgba(15,17,22,.5)}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h2{margin:0 0 18px;font-size:19px;letter-spacing:-.3px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field textarea{min-height:110px;resize:vertical}
.field textarea.tall{min-height:160px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.form-error{color:var(--danger);font-size:13px;min-height:18px;margin:0}
.star-pick{display:flex;gap:4px}
.star-pick button{font-size:26px;color:var(--border);padding:2px;line-height:1}
.star-pick button[aria-pressed="true"]{color:var(--star)}
.row-2{display:flex;gap:10px;flex-wrap:wrap}
.row-2 .field{flex:1;min-width:140px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;
  background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:no-preference){
  .modal{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:480px){
  .detail-card{padding:18px}
}
</style>

<header class="site-header">
  <div class="header-inner">
    <button class="brand" id="brand-home" aria-label="커뮤니티 홈으로">
      <span class="brand-mark" aria-hidden="true">커</span><span class="brand-text">커뮤니티</span>
    </button>
    <nav class="top-nav" aria-label="주요 메뉴">
      <button class="nav-tab" id="nav-board">게시판</button>
      <button class="nav-tab" id="nav-reviews">회사 리뷰</button>
    </nav>
    <span class="header-spacer"></span>
    <button class="btn btn-accent" id="write-open">✏️ 글쓰기</button>
  </div>
</header>

<div class="shell">
  <div id="banner" class="banner" hidden></div>
  <div id="view-root"></div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const CATEGORIES = [
  { key: "free",   label: "자유",     cssVar: "--cat-free" },
  { key: "qna",    label: "질문",     cssVar: "--cat-qna" },
  { key: "info",   label: "정보",     cssVar: "--cat-info" },
  { key: "review", label: "후기",     cssVar: "--cat-review" },
  { key: "job",    label: "구인구직", cssVar: "--cat-job" },
  { key: "notice", label: "공지",     cssVar: "--cat-notice" },
];
const catByKey = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));
const STATUS_LABELS = { current: "현직", former: "전직", interview: "면접" };
const LOCK_FILLER = "이 내용은 조건을 충족한 회원만 볼 수 있습니다. 가려진 내용은 조건을 충족하면 바로 열립니다.";

/* ---------- state ---------- */
const state = {
  db: null, user: null,
  uid: null, canWrite: null, canEdit: false,
  posts: [],            // {id, title, body, category, authorId, createdAt, views}
  comments: [],         // {id, postId, authorId, body, createdAt}
  reviews: [],          // {id, company, rating, status, oneliner, pros, cons, authorId, createdAt}
  likes: {},            // userId -> {postId: true}
  profiles: {},         // userId -> name
  loadedPosts: false, loadedComments: false, loadedLikes: false, loadedReviews: false,
  connectTimedOut: false,
  category: "all",
  search: "",
  route: "",            // "" = board list, "reviews" = review page, otherwise post id
  openCompany: null,    // expanded company on review page
  deleteArmed: null,
};
const viewedThisSession = new Set();

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function timeAgo(ts) {
  if (!ts) return "";
  const diff = Date.now() - ts;
  if (diff < 60e3) return "방금 전";
  if (diff < 3600e3) return Math.floor(diff / 60e3) + "분 전";
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + "시간 전";
  if (diff < 7 * 86400e3) return Math.floor(diff / 86400e3) + "일 전";
  const d = new Date(ts);
  return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
}
function authorName(uid) {
  if (!uid) return "익명";
  const n = state.profiles[uid];
  return (n === undefined) ? "..." : (n || "익명");
}
function likeCount(postId) {
  let n = 0;
  for (const uid in state.likes) if (state.likes[uid] && state.likes[uid][postId]) n++;
  return n;
}
function myLiked(postId) {
  return !!(state.uid && state.likes[state.uid] && state.likes[state.uid][postId]);
}
function commentsFor(postId) {
  return state.comments.filter(c => c.postId === postId).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}
function catBadge(key) {
  const c = catByKey[key] || catByKey.free;
  return '<span class="cat-badge" style="color:var(' + c.cssVar + ');background:color-mix(in srgb, var(' + c.cssVar + ') 12%, transparent)">' + esc(c.label) + "</span>";
}
function stars(n, outOf) {
  const full = Math.max(0, Math.min(5, Math.round(n)));
  return '<span class="stars" aria-label="별점 ' + (outOf ? n.toFixed(1) : full) + '점">'
    + "★".repeat(full) + '<span class="off">' + "★".repeat(5 - full) + "</span></span>";
}

/* ---------- 조건부 열람 (성예사 오마주) ---------- */
// 회사 리뷰 본문: 내가 리뷰를 1건 이상 작성해야 열람
function reviewsUnlocked() {
  if (state.canEdit) return true;
  return !!(state.uid && state.reviews.some(r => r.authorId === state.uid));
}
// 게시글 댓글: 글 또는 댓글을 1개 이상 작성한 회원만 열람 (글 작성자 본인 포함)
function commentsUnlocked(post) {
  if (state.canEdit) return true;
  if (!state.uid) return false;
  if (post && post.authorId === state.uid) return true;
  return state.posts.some(p => p.authorId === state.uid)
      || state.comments.some(c => c.authorId === state.uid);
}

let toastTimer = null;
function toast(msg) {
  const root = $("#toast-root");
  root.innerHTML = '<div class="toast">' + esc(msg) + "</div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2600);
}

/* ---------- profile resolution ---------- */
let profileFetchQueued = false;
async function resolveProfiles() {
  if (!state.user || profileFetchQueued) return;
  const ids = new Set();
  state.posts.forEach(p => p.authorId && ids.add(p.authorId));
  state.comments.forEach(c => c.authorId && ids.add(c.authorId));
  state.reviews.forEach(r => r.authorId && ids.add(r.authorId));
  const missing = [...ids].filter(id => state.profiles[id] === undefined);
  if (!missing.length) return;
  profileFetchQueued = true;
  try {
    const ps = await state.user.profiles(missing);
    missing.forEach(id => { state.profiles[id] = (ps && ps[id] && ps[id].name) || ""; });
    render();
  } catch (e) {
    missing.forEach(id => { state.profiles[id] = ""; });
  } finally {
    profileFetchQueued = false;
  }
}

/* ---------- views ---------- */
function render() {
  // header nav state
  $("#nav-board").setAttribute("aria-pressed", String(state.route !== "reviews"));
  $("#nav-reviews").setAttribute("aria-pressed", String(state.route === "reviews"));
  $("#write-open").innerHTML = state.route === "reviews" ? "⭐ 리뷰 쓰기" : "✏️ 글쓰기";

  const root = $("#view-root");
  if (state.route === "reviews") {
    root.innerHTML = renderReviews();
    bindReviews();
  } else {
    const post = state.route ? state.posts.find(p => p.id === state.route) : null;
    if (state.route && post) {
      root.innerHTML = renderDetail(post);
      bindDetail(post);
    } else {
      root.innerHTML = renderList();
      bindList();
    }
  }
  resolveProfiles();
}

function filteredPosts() {
  const q = state.search.trim().toLowerCase();
  return state.posts.filter(p => {
    if (state.category !== "all" && p.category !== state.category) return false;
    if (q && !((p.title || "").toLowerCase().includes(q) || (p.body || "").toLowerCase().includes(q))) return false;
    return true;
  });
}

/* ---------- 회사 리뷰 (잡코리아 오마주) ---------- */
function companyGroups() {
  const q = state.search.trim().toLowerCase();
  const map = new Map();
  for (const r of state.reviews) {
    const name = (r.company || "").trim();
    if (!name) continue;
    if (q && !name.toLowerCase().includes(q)) continue;
    if (!map.has(name)) map.set(name, []);
    map.get(name).push(r);
  }
  const groups = [...map.entries()].map(([name, rs]) => {
    const avg = rs.reduce((s, r) => s + (Number(r.rating) || 0), 0) / rs.length;
    const latest = Math.max(...rs.map(r => r.createdAt || 0));
    return { name, reviews: rs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), avg, latest };
  });
  groups.sort((a, b) => b.latest - a.latest);
  return groups;
}

              + '<div class="pc-row"><span class="pc-tag bad">단점</span><span class="pc-body locked-text" aria-hidden="true">' + esc(LOCK_FILLER) + "</span></div></div>";

                    : '<button class="comment-del" style="margin-left:auto" data-del-review="' + esc(r.id) + '">삭제</button>')
                : "")
            + "</div>"

            + prosCons
            + '<div class="review-meta"><span class="author" data-uid="' + esc(r.authorId || "") + '">' + esc(authorName(r.authorId)) + "</span>"
            + '<span class="dot"></span><span>' + timeAgo(r.createdAt) + "</span></div>"

      }
      return '<button class="company-row" data-company="' + esc(g.name) + '">'
        + '<span class="company-head"><span class="company-name">' + esc(g.name) + "</span>"
        + stars(g.avg, true)
        + '<span class="company-score">' + g.avg.toFixed(1) + "</span>"
        + '<span class="company-count">리뷰 ' + g.reviews.length + "</span>"
        + '<span class="company-open">' + (open ? "접기 ▲" : "펼치기 ▼") + "</span></span>"
        + "</button>" + expanded;
    }).join("");
  } else if (!state.db || (!state.loadedReviews && !state.connectTimedOut)) {
    body = '<div class="empty"><div class="empty-icon">⭐</div><h3>불러오는 중이에요</h3><p>잠시만 기다려 주세요.</p></div>';
  } else {
    body = '<div class="empty"><div class="empty-icon">⭐</div>'
      + "<h3>" + (state.search ? "조건에 맞는 회사가 없어요" : "아직 등록된 회사 리뷰가 없어요") + "</h3>"
      + "<p>" + (state.search ? "검색어를 바꿔 보세요." : "다녔던 회사, 면접 본 회사의 솔직한 리뷰를 남겨 보세요.") + "</p>"

    + body
    + "</div></div>"
    + '<aside class="aside-col">'
    + '<div class="aside-card"><h3>🏆 평점 TOP</h3>'
    + (top.length
        ? top.map((g, i) => '<button class="hot-item" data-company="' + esc(g.name) + '"><span class="hot-rank">' + (i + 1) + '</span><span class="hot-title">' + esc(g.name) + '</span><span class="hot-meta">★' + g.avg.toFixed(1) + "</span></button>").join("")
        : '<p class="about-text">리뷰가 쌓이면 평점 높은 회사가 표시됩니다.</p>')
    + "</div>"
    + '<div class="aside-card"><h3>🔒 열람 조건</h3><p class="about-text">리뷰의 장점·단점 내용은 <b>리뷰를 1건 작성한 회원</b>에게만 공개됩니다. 별점과 한줄평은 누구나 볼 수 있어요. 서로의 솔직한 리뷰가 모두에게 도움이 됩니다.</p></div>'
    + "</aside></div>";
}

/* ---------- bindings ---------- */
function goTo(route) {
  state.deleteArmed = null;
  if ((route === "reviews") !== (state.route === "reviews")) state.search = "";
  state.route = route;
  const want = route ? "#" + route : "#";
  if (location.hash !== want && !(route === "" && location.hash === "")) {
    try { location.hash = route || ""; } catch (e) {}
  }
  render();
  window.scrollTo(0, 0);
  if (route && route !== "reviews") bumpViews(route);
}

function bindSearch() {
  const si = $("#search-input");
  if (!si) return;
  si.addEventListener("input", () => {
    state.search = si.value;
    const pos = si.selectionStart;
    render();
    const si2 = $("#search-input");
    if (si2) { si2.focus(); try { si2.setSelectionRange(pos, pos); } catch (e) {} }
  });
}

function bindList() {
  document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
    state.category = ch.dataset.cat; render();
  }));
  document.querySelectorAll("[data-post]").forEach(el => el.addEventListener("click", () => goTo(el.dataset.post)));
  bindSearch();
  const ew = $("#empty-write");
  if (ew) ew.addEventListener("click", openWriteModal);
}

function bindReviews() {
  bindSearch();
  document.querySelectorAll("[data-company]").forEach(el => el.addEventListener("click", () => {
    state.openCompany = (state.openCompany === el.dataset.company) ? null : el.dataset.company;
    state.deleteArmed = null;
    render();
  }));
  const er = $("#empty-review");
  if (er) er.addEventListener("click", openReviewModal);
  const lw = $("#lock-write-review");
  if (lw) lw.addEventListener("click", ev => { ev.preventDefault(); openReviewModal(); });
  document.querySelectorAll("[data-del-cancel]").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); state.deleteArmed = null; render(); }));
  document.querySelectorAll("[data-del-review]").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); state.deleteArmed = "review:" + b.dataset.delReview; render(); }));
  document.querySelectorAll("[data-del-review-yes]").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); deleteReview(b.dataset.delReviewYes); }));
}

function bindDetail(p) {
  $("#back-btn").addEventListener("click", () => goTo(""));
  $("#like-btn").addEventListener("click", () => toggleLike(p.id));
  const dp = $("#del-post");
  if (dp) dp.addEventListener("click", () => { state.deleteArmed = "post:" + p.id; render(); });
  const dpy = $("#del-post-yes");
  if (dpy) dpy.addEventListener("click", () => deletePost(p));
  document.querySelectorAll("[data-del-cancel]").forEach(b => b.addEventListener("click", () => { state.deleteArmed = null; render(); }));
  document.querySelectorAll("[data-del-comment]").forEach(b => b.addEventListener("click", () => { state.deleteArmed = "comment:" + b.dataset.delComment; render(); }));
  document.querySelectorAll("[data-del-comment-yes]").forEach(b => b.addEventListener("click", () => deleteComment(b.dataset.delCommentYes)));
  $("#comment-form").addEventListener("submit", ev => {
    ev.preventDefault();
    submitComment(p.id);
  });
}

  if (!state.db) { toast("데이터에 연결되어 있지 않아요."); return false; }

  return true;
}

  document.querySelectorAll("[data-star]").forEach(b => b.addEventListener("click", () => {
    pickedRating = Number(b.dataset.star);
    document.querySelectorAll("[data-star]").forEach(x => x.setAttribute("aria-pressed", String(Number(x.dataset.star) <= pickedRating)));
  }));
  $("#r-cancel").addEventListener("click", closeModal);
  $("#modal-wrap").addEventListener("click", ev => { if (ev.target.id === "modal-wrap") closeModal(); });
  $("#r-submit").addEventListener("click", submitReview);
  $("#r-company").focus();
}
function closeModal() { $("#modal-root").innerHTML = ""; }

let submitting = false;
async function submitPost() {
  if (submitting) return;
  const title = $("#w-title").value.trim();
  const body = $("#w-body").value.trim();
  const category = $("#w-cat").value;
  const err = $("#w-error");
  if (!title) { err.textContent = "제목을 입력해 주세요."; return; }
  if (!body) { err.textContent = "내용을 입력해 주세요."; return; }
  err.textContent = "";
  submitting = true;
  $("#w-submit").textContent = "등록 중...";
  try {
    const id = newId();
    await state.db.collection("posts").doc(id).set({
      title, body, category,
      authorId: state.uid || null,
      createdAt: Date.now(),
      views: 0,
    });
    closeModal();
    toast("글이 등록되었어요.");
    goTo(id);
  } catch (e) {
    err.textContent = (e && e.code === "invalid_argument")
      ? "글을 저장할 권한이 없어요."
      : "저장에 실패했어요. 잠시 후 다시 시도해 주세요.";
    const sb = $("#w-submit"); if (sb) sb.textContent = "등록";
  } finally {
    submitting = false;
  }
}

async function submitReview() {
  if (submitting) return;
  const company = $("#r-company").value.trim();
  const status = $("#r-status").value;
  const oneliner = $("#r-oneliner").value.trim();
  const pros = $("#r-pros").value.trim();
  const cons = $("#r-cons").value.trim();
  const err = $("#r-error");
  if (!company) { err.textContent = "회사명을 입력해 주세요."; return; }
  if (!pickedRating) { err.textContent = "별점을 선택해 주세요."; return; }
  if (!pros && !cons) { err.textContent = "장점이나 단점 중 하나는 적어 주세요."; return; }
  err.textContent = "";
  submitting = true;
  $("#r-submit").textContent = "등록 중...";
  try {
    const id = newId();
    await state.db.collection("reviews").doc(id).set({
      company, rating: pickedRating, status, oneliner, pros, cons,
      authorId: state.uid || null,
      createdAt: Date.now(),
    });
    closeModal();
    state.openCompany = company;
    toast("리뷰가 등록되었어요. 이제 모든 리뷰를 볼 수 있습니다!");
    goTo("reviews");
  } catch (e) {
    err.textContent = (e && e.code === "invalid_argument")
      ? "리뷰를 저장할 권한이 없어요."
      : "저장에 실패했어요. 잠시 후 다시 시도해 주세요.";
    const sb = $("#r-submit"); if (sb) sb.textContent = "등록";
  } finally {
    submitting = false;
  }
}

/* ---------- actions ---------- */
let likeBusy = false;
async function toggleLike(postId) {
  if (!state.db) { toast("데이터에 연결되어 있지 않아요."); return; }
  if (!state.uid) { toast("로그인하면 좋아요를 누를 수 있어요."); return; }
  if (state.canWrite === false) { toast("좋아요 권한이 없어요."); return; }
  if (likeBusy) return;
  likeBusy = true;
  try {
    const mine = Object.assign({}, (state.likes[state.uid] || {}));
    if (mine[postId]) delete mine[postId]; else mine[postId] = true;
    await state.db.doc("likes/" + state.uid).set({ posts: mine });
  } catch (e) {
    toast("좋아요 처리에 실패했어요.");
  } finally {
    likeBusy = false;
  }
}

let commentBusy = false;
async function submitComment(postId) {
  const input = $("#comment-input");
  const body = input.value.trim();
  if (!body || commentBusy) return;
  if (!state.db) { toast("데이터에 연결되어 있지 않아요."); return; }
  if (state.canWrite === false) { toast("댓글 권한이 없어요."); return; }
  commentBusy = true;
  try {
    await state.db.collection("comments").add({
      postId, body,
      authorId: state.uid || null,
      createdAt: Date.now(),
    });
    input.value = "";
  } catch (e) {
    toast("댓글 등록에 실패했어요.");
  } finally {
    commentBusy = false;
  }
}

async function deletePost(p) {
  try {
    await state.db.doc("posts/" + p.id).delete();
    const cs = commentsFor(p.id);
    for (const c of cs) {
      try { await state.db.doc("comments/" + c.id).delete(); } catch (e) {}
    }
    toast("글을 삭제했어요.");
    goTo("");
  } catch (e) {
    toast("삭제에 실패했어요.");
    state.deleteArmed = null; render();
  }
}

async function deleteComment(id) {
  try {
    await state.db.doc("comments/" + id).delete();
    state.deleteArmed = null;
  } catch (e) {
    toast("삭제에 실패했어요.");
    state.deleteArmed = null; render();
  }
}

async function deleteReview(id) {
  try {
    await state.db.doc("reviews/" + id).delete();
    state.deleteArmed = null;
    toast("리뷰를 삭제했어요.");
  } catch (e) {
    toast("삭제에 실패했어요.");
    state.deleteArmed = null; render();
  }
}

async function bumpViews(postId) {
  if (!state.db || viewedThisSession.has(postId)) return;
  viewedThisSession.add(postId);
  if (state.canWrite === false) return;
  const p = state.posts.find(x => x.id === postId);
  if (!p) return;
  try {
    await state.db.doc("posts/" + postId).update({ views: (p.views || 0) + 1 });
  } catch (e) { /* read-only viewer: fine */ }
}

/* ---------- boot ---------- */
async function getCap(name) {
  try {
    return (window.claude && window.claude.use) ? await window.claude.use(name) : null;
  } catch (e) { return null; }
}

function routeFromHash() {
  const h = (location.hash || "").replace(/^#/, "");
  return /^[A-Za-z0-9-]+$/.test(h) ? h : "";
}

async function boot() {
  $("#brand-home").addEventListener("click", () => { state.category = "all"; state.search = ""; goTo(""); });
  $("#nav-board").addEventListener("click", () => goTo(""));
  $("#nav-reviews").addEventListener("click", () => goTo("reviews"));
  $("#write-open").addEventListener("click", () => {
    if (state.route === "reviews") openReviewModal(); else openWriteModal();
  });
  window.addEventListener("hashchange", () => {
    const r = routeFromHash();
    if (r !== state.route) {
      state.route = r; state.deleteArmed = null; render();
      if (r && r !== "reviews") bumpViews(r);
    }
  });
  state.route = routeFromHash();
  render();
  renderBanner();

  const [db, user] = await Promise.all([getCap("db"), getCap("user")]);
  state.db = db; state.user = user;
  if (user) {
    try { state.uid = await user.id(); } catch (e) {}
    try { state.canWrite = await user.can("data.write"); } catch (e) {}
    try { state.canEdit = !!(await user.canEdit()); } catch (e) {}
  }
  renderBanner();
  if (!db) { render(); return; }

  const connectTimer = setTimeout(() => { state.connectTimedOut = true; renderBanner(); render(); }, 10000);
  const maybeClear = () => {
    if (state.loadedPosts && state.loadedComments && state.loadedLikes && state.loadedReviews) {
      clearTimeout(connectTimer); state.connectTimedOut = false; renderBanner();
    }
  };

  db.collection("posts").orderBy("createdAt", "desc").limit(500).onSnapshot(snap => {
    state.posts = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
    if (!snap.metadata.fromCache) { state.loadedPosts = true; maybeClear(); }
    render();
  }, e => { state.loadedPosts = true; maybeClear(); toast("글 목록을 불러오지 못했어요."); });

  db.collection("comments").limit(1000).onSnapshot(snap => {
    state.comments = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
    if (!snap.metadata.fromCache) { state.loadedComments = true; maybeClear(); }
    render();
  }, e => { state.loadedComments = true; maybeClear(); });

  db.collection("reviews").orderBy("createdAt", "desc").limit(1000).onSnapshot(snap => {
    state.reviews = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
    if (!snap.metadata.fromCache) { state.loadedReviews = true; maybeClear(); }
    render();
  }, e => { state.loadedReviews = true; maybeClear(); });

  db.collection("likes").limit(1000).onSnapshot(snap => {
    const likes = {};
    snap.docs.forEach(d => { if (d.exists) likes[d.id] = (d.data() || {}).posts || {}; });
    state.likes = likes;
    if (!snap.metadata.fromCache) { state.loadedLikes = true; maybeClear(); }
    render();
  }, e => { state.loadedLikes = true; maybeClear(); });

  if (state.route && state.route !== "reviews") bumpViews(state.route);
}

/* preview hook for local layout checks only (no-op in production use) */
window.__app = { state, render };

boot();
})();
</script>
